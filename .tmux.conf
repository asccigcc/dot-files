# Tmux configuration file
# Maintainer: asccigcc
# Created:    December 23, 2016
# Updated:    August 30, 2026
# Version:    0.4.0
# Portable:   macOS + Linux (X11/Wayland)
# Target:     tmux >= 3.2 (running 3.5a)

# ─── Prefix ──────────────────────────────────────────────────────────
# 'C-a' is easier to reach than 'C-b'.
set -g prefix C-a
unbind C-b
# Prefix twice sends a literal C-a through, so readline's
# beginning-of-line still works inside tmux.
bind C-a send-prefix

# ─── Server / terminal ───────────────────────────────────────────────
set -sg escape-time 1

# 24-bit colour. Without this nvim/bat/delta silently degrade to 256.
# terminal-features landed in tmux 3.2; LTS distros still ship 3.0/3.1,
# where setting it is an error -- they need the legacy override.
if-shell 'tmux -V | grep -qE "tmux (3\.([2-9]|[0-9][0-9])|[4-9])"' \
  'set -sa terminal-features ",xterm-256color:RGB,*256col*:RGB"' \
  'set -ga terminal-overrides ",*256col*:Tc"'

# ─── Indexing ────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
# Closing a middle window closes the gap instead of leaving a hole.
set -g renumber-windows on

# ─── Behaviour ───────────────────────────────────────────────────────
set -g allow-rename off
set -g mouse on
setw -g mode-keys vi

# ─── Copy mode (vi) ──────────────────────────────────────────────────
# copy.sh probes for pbcopy / wl-copy / xclip / xsel, so one binding
# covers macOS, Wayland and X11. (reattach-to-user-namespace has been
# unnecessary on macOS since tmux 2.6.)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.tmux/scripts/copy.sh"
bind -T copy-mode-vi Escape send -X cancel

# ─── Keybindings ─────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Splits and new windows inherit the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane nav/resize stays behind the prefix: M-Left/M-Right are
# backward-word/forward-word in zsh and must not be stolen.
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# 'l' was last-window by default; it lives on Tab now.
bind Tab last-window

# ─── Plugins ─────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# Resurrect keeps scrollback; continuum autosaves every 15 min and
# restores on a fresh server start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# prefix + u -> fzf picker of URLs on screen (replaces urlview).
set -g @fzf-url-bind 'u'

# ─── Palette ─────────────────────────────────────────────────────────
#   colour141  violet   accent: session block, clock, active pane, tab
#   colour233  base     bar background
#   colour235  slate    segment background
#   colour238  slate+   segment background, one step lighter
#   colour245  text     normal foreground
#   colour240  dim      borders, inactive text
#   colour214  orange   PFX   (prefix armed)
#   colour215  amber    ZOOM  (pane zoomed)
#   colour203  red      SYNC / BELL / battery <= 15%
#   colour151  green    battery healthy
# Retune by sed-ing these numbers here and in ~/.tmux/scripts/battery.sh.

# ─── Status bar ──────────────────────────────────────────────────────
set -g status-position top
set -g status-justify centre
set -g status-style "fg=colour245,bg=colour233"
set -g status-left-length 80
set -g status-right-length 100
# Nothing on the bar ticks per-second, so 5s is plenty.
set -g status-interval 5

# Window tabs
set -g window-status-separator ""
set -g window-status-format         "#[fg=colour245,bg=colour233] #I:#W#F "
set -g window-status-current-format "#[fg=colour233,bg=colour141,bold] #I:#W#F "
set -g window-status-activity-style "fg=colour215,bg=colour233"
# The formats above carry their own #[...], so the styles stay neutral.
# Setting them explicitly also clears any value a previous theme left
# behind in a long-running server.
set -g window-status-style         "default"
set -g window-status-current-style "default"

# Panes, messages, modes
setw -g pane-border-style        "fg=colour238"
setw -g pane-active-border-style "fg=colour141"
set  -g message-style            "fg=colour233,bg=colour141,bold"
set  -g message-command-style    "fg=colour233,bg=colour141,bold"
setw -g mode-style               "fg=colour233,bg=colour141"
setw -g clock-mode-colour        colour141
setw -g clock-mode-style         24
set  -g display-panes-colour        colour240
set  -g display-panes-active-colour colour141

# Everything below is a native #{...} format (expanded in-process, free)
# except the battery, the single #() subprocess -- one pmset call per
# status-interval, ~20ms, run asynchronously so it never blocks a
# redraw. On Linux it reads sysfs instead -- no subprocess at all.
# (~/.tmux/scripts/net.sh is kept but unreferenced: SSID when the OS
# permits, LAN IP otherwise. Both scripts branch on uname internally.)
#
#   #S                      session name
#   #{b:pane_current_path}  cwd basename
#   #{pane_current_command} what the active pane is running
#   #{session_windows}      window count
#   #{host_short}           only meaningful over ssh
# Transient warnings -- render to nothing until they fire:
#   client_prefix   C-a armed        pane_synchronized  typing into all panes
#   window_zoomed   a pane is zoomed window_bell_flag   bell/alert
set -g status-left  "#[fg=colour233,bg=colour141,bold] #S #[fg=colour245,bg=colour235,nobold] #{b:pane_current_path} #[fg=colour245,bg=colour238] #{pane_current_command} #{?pane_synchronized,#[fg=colour233#,bg=colour203#,bold] SYNC ,}#{?client_prefix,#[fg=colour233#,bg=colour214#,bold] PFX ,}#[fg=colour240,bg=colour233] "
set -g status-right "#{?window_bell_flag,#[fg=colour233#,bg=colour203#,bold] BELL ,}#{?window_zoomed_flag,#[fg=colour233#,bg=colour215#,bold] ZOOM ,}#[fg=colour245,bg=colour238] #{session_windows}w #[bg=colour235] #(~/.tmux/scripts/battery.sh) #[fg=colour245,bg=colour238] %d %b #[fg=colour233,bg=colour141,bold] %H:%M #[fg=colour245,bg=colour235,nobold] #{host_short} "

# Bootstrap tpm on a fresh machine.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
